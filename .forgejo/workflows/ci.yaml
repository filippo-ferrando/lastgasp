# Tests pushes to main and pull requests. Tags are tested by release.yaml.
# Runs only when code, build or deploy files change; docs and Markdown files are skipped.
name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "examples/**"
      - "Makefile"
      - "Dockerfile"
      - "compose.yaml"
      - ".forgejo/workflows/ci.yaml"
      - "!**.md"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "examples/**"
      - "Makefile"
      - "Dockerfile"
      - "compose.yaml"
      - ".forgejo/workflows/ci.yaml"
      - "!**.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # For the chart checks in make test.
      - uses: azure/setup-helm@v4

      # The docker compose check in make test skips itself when docker is missing.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # 32 bit ARM has its own type sizes, and the release builds it.
      - name: Build for every release architecture
        run: |
          for arch in amd64 arm64 arm; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=7 go build -o /dev/null ./cmd/... || exit 1
          done

      - name: Test
        run: make test
