# On a tag like v1.2.0: test, publish the agent, server and installer as release files,
# push multi-arch server and agent images and the Helm chart to the Forgejo container registry.
#
# Repository secret LOCAL_TOKEN: an access token of the user that pushes the tag, with write:package.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  REGISTRY: git.internal.fferrando.cc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # For the chart checks in make test.
      - uses: azure/setup-helm@v4

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release files
        run: make dist VERSION=${{ github.ref_name }}

      # The CHANGELOG.md section of the tag becomes the release notes, followed by install lines.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          SERVER_URL: "https://git.fferrando.cc"
          REPOSITORY: ${{ github.repository }}
        run: |
          image=$(echo "$REGISTRY/$REPOSITORY-server" | tr '[:upper:]' '[:lower:]')
          # Doc links in the changelog point at the files of this tag.
          changes=$(sh deploy/changelog.sh "$TAG" CHANGELOG.md "$SERVER_URL/$REPOSITORY/src/tag/$TAG")
          if [ -z "$changes" ]; then
            echo "CHANGELOG.md has no section for $TAG and no Unreleased section" >&2
            exit 1
          fi
          {
            echo "$changes"
            echo
            echo "## Install"
            echo
            echo "Install an agent: create a join token in the web UI (Agents, \"Add agents\") and run the command it shows, or:"
            echo
            echo '```sh'
            echo "curl -fsSL $SERVER_URL/$REPOSITORY/releases/download/$TAG/install-agent.sh | sudo sh -s -- --server SERVER:5140 --token TOKEN"
            echo '```'
            echo
            echo "Server image: \`$image:$TAG\`, agent image: \`${image%-server}-agent:$TAG\`"
            echo
            echo "Helm chart: \`helm install lastgasp oci://$REGISTRY/${REPOSITORY%%/*}/lastgasp --version ${TAG#v}\`"
            echo
            echo "Full changelog: [CHANGELOG.md]($SERVER_URL/$REPOSITORY/src/tag/$TAG/CHANGELOG.md)"
          } > notes.md

      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: |
            dist/*
            notes.md
          retention-days: 1

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Docker CLI
        run: |
          curl -fsSL https://get.docker.com | sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo registry
        run: |
          echo "${{ secrets.LOCAL_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ github.actor }}" \
            --password-stdin

      # Only final versions move the short tags, a v1.2.0-rc1 keeps them where they are.
      - name: Pick image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for part in server agent agent-journal; do
            image=$(echo "$REGISTRY/$REPOSITORY-$part" | tr '[:upper:]' '[:lower:]')
            {
              echo "$part<<EOF"
              echo "$image:$TAG"
              case $TAG in
                *-*) ;;
                *) minor=${TAG%.*}; echo "$image:${TAG#v}"; echo "$image:${minor#v}"; echo "$image:latest" ;;
              esac
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      # The Dockerfile cross compiles in its build stage, so arm64 needs no emulation.
      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.server }}

      - name: Build and push agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: agent
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.agent }}

      - name: Build and push agent image with journalctl
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: agent-journal
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.agent-journal }}

  # The chart gets the version of the tag, and its default images are the ones pushed above.
  chart:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: Package and push chart
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          owner=$(echo "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.LOCAL_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/lastgasp --version "${TAG#v}" --app-version "$TAG" -d out
          helm push "out/lastgasp-${TAG#v}.tgz" "oci://$REGISTRY/$owner"

  release:
    needs: [build, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: out/dist/*
          body_path: out/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
