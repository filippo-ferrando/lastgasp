# On a tag like v1.2.0: test, publish the agent, server and installer as release files,
# and push a multi-arch server image to the Forgejo container registry.
#
# Repository secret LOCAL_TOKEN: an access token of the user that pushes the tag, with write:package.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  REGISTRY: git.internal.fferrando.cc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release files
        run: make dist VERSION=${{ github.ref_name }}

      # The changes since the previous tag become the release notes.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          image=$(echo "$REGISTRY/$REPOSITORY-server" | tr '[:upper:]' '[:lower:]')
          {
            echo "Install an agent: create a join token in the web UI (Agents, \"add agents\") and run the command it shows, or:"
            echo
            echo '```sh'
            echo "curl -fsSL $SERVER_URL/$REPOSITORY/releases/download/$TAG/install-agent.sh | sudo sh -s -- --server SERVER:5140 --token TOKEN"
            echo '```'
            echo
            echo "Server image: \`$image:$TAG\`"
            echo
            echo "Changes${prev:+ since $prev}:"
            echo
            git log --pretty='- %s' ${prev:+"$prev.."}"$TAG"
          } > notes.md

      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: |
            dist/*
            notes.md
          retention-days: 1

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Docker CLI
        run: |
          curl -fsSL https://get.docker.com | sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo registry
        run: |
          echo "${{ secrets.LOCAL_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ github.actor }}" \
            --password-stdin

      # Only final versions move the short tags, a v1.2.0-rc1 keeps them where they are.
      - name: Pick image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image=$(echo "$REGISTRY/$REPOSITORY-server" | tr '[:upper:]' '[:lower:]')
          {
            echo "tags<<EOF"
            echo "$image:$TAG"
            case $TAG in
              *-*) ;;
              *) minor=${TAG%.*}; echo "$image:${TAG#v}"; echo "$image:${minor#v}"; echo "$image:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile cross compiles in its build stage, so arm64 needs no emulation.
      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}

  release:
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: out/dist/*
          body_path: out/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
