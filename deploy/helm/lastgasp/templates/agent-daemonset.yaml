{{- if .Values.agent.enabled }}
{{- $a := .Values.agent }}
{{- $enroll := $a.enroll.tokenSecret.name }}
{{- $journal := $a.journal.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lastgasp.fullname" . }}-agent
  labels:
    {{- include "lastgasp.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  # The old pod stops before the new one starts, so the new one finds the stash of the old one.
  updateStrategy:
    {{- toYaml $a.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "lastgasp.selectorLabels" (dict "ctx" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lastgasp.selectorLabels" (dict "ctx" . "component" "agent") | nindent 8 }}
        {{- with $a.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The agent reads its key once at start, so a new key restarts it.
        checksum/key: {{ .Values.key | toYaml | sha256sum }}
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if $a.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      automountServiceAccountToken: false
      {{- with $a.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $enroll }}
      initContainers:
        # Gets a key of its own once, then keeps it on the node across pod restarts and reboots.
        - name: enroll
          image: {{ include "lastgasp.image" (dict "ctx" . "image" $a.image) }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - enroll
            - -server={{ include "lastgasp.agentServer" . }}
            - -token-file=/etc/lastgasp-join/token
            - -hostname=$(NODE_NAME)
            - -key-file=/var/lib/lastgasp/agent.key
            - -if-missing
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: key
              mountPath: /var/lib/lastgasp
            - name: join
              mountPath: /etc/lastgasp-join
              readOnly: true
      {{- end }}
      containers:
        - name: agent
          image: {{ include "lastgasp.image" (dict "ctx" . "image" (ternary $a.journal.image $a.image $journal)) }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - -server={{ include "lastgasp.agentServer" . }}
            {{- if $enroll }}
            - -key-file=/var/lib/lastgasp/agent.key
            {{- else }}
            - -key-file=/etc/lastgasp/agent.key
            {{- end }}
            # The node name, so logs are grouped by node and not by pod.
            - -hostname=$(NODE_NAME)
            {{- if not $a.pstore }}
            - -pstore=
            {{- end }}
            {{- if $a.stash }}
            - -stash=/run/lastgasp/agent.stash
            {{- else }}
            - -stash=
            {{- end }}
            {{- if not $a.forwardSecrecy }}
            - -forward-secrecy=false
            {{- end }}
            {{- if $a.pmsg }}
            - -pmsg=/dev/pmsg0
            {{- else }}
            - -pmsg=
            {{- end }}
            {{- if $journal }}
            - -journal
            - -journal-priority={{ $a.journal.priority }}
            - -journal-rate={{ $a.journal.rate }}
            {{- end }}
            {{- with $a.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with $a.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml $a.securityContext | nindent 12 }}
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          volumeMounts:
            {{- if $a.kmsgHostPath }}
            - name: kmsg
              mountPath: /dev/kmsg
              readOnly: true
            {{- end }}
            {{- if $a.pstore }}
            - name: pstore
              mountPath: /sys/fs/pstore
              readOnly: true
            {{- end }}
            {{- if $a.stash }}
            - name: stash
              mountPath: /run/lastgasp
            {{- end }}
            {{- if $a.pmsg }}
            - name: pmsg
              mountPath: /dev/pmsg0
            {{- end }}
            {{- if $journal }}
            # journalctl reads the journal of this machine ID, from these two places.
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: journal-run
              mountPath: /run/log/journal
              readOnly: true
            {{- if $a.journal.persistent }}
            - name: journal-var
              mountPath: /var/log/journal
              readOnly: true
            {{- end }}
            {{- end }}
            - name: key
              mountPath: {{ ternary "/var/lib/lastgasp" "/etc/lastgasp" (not (empty $enroll)) }}
              readOnly: true
      volumes:
        {{- if $a.kmsgHostPath }}
        - name: kmsg
          hostPath:
            path: /dev/kmsg
            type: CharDevice
        {{- end }}
        {{- if $a.pstore }}
        - name: pstore
          hostPath:
            path: /sys/fs/pstore
            type: Directory
        {{- end }}
        {{- if $a.stash }}
        # /run on the node is tmpfs, and the stash outlives the pod.
        - name: stash
          hostPath:
            path: /run/lastgasp
            type: DirectoryOrCreate
        {{- end }}
        {{- if $a.pmsg }}
        # CharDevice: a missing device stops the pod, instead of a directory made in its place.
        - name: pmsg
          hostPath:
            path: /dev/pmsg0
            type: CharDevice
        {{- end }}
        {{- if $journal }}
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: journal-run
          hostPath:
            path: /run/log/journal
            type: Directory
        {{- if $a.journal.persistent }}
        # Directory, not DirectoryOrCreate: a new /var/log/journal would make journald keep logs on disk.
        - name: journal-var
          hostPath:
            path: /var/log/journal
            type: Directory
        {{- end }}
        {{- end }}
        {{- if $enroll }}
        # Kept on the node disk, so a reboot does not need a new enrollment.
        - name: key
          hostPath:
            path: {{ $a.enroll.keyDir }}
            type: DirectoryOrCreate
        - name: join
          secret:
            secretName: {{ $enroll }}
            items:
              - key: {{ $a.enroll.tokenSecret.key }}
                path: token
            defaultMode: 0400
        {{- else }}
        - name: key
          secret:
            secretName: {{ include "lastgasp.keySecretName" . }}
            items:
              - key: agent.key
                path: agent.key
            defaultMode: 0400
        {{- end }}
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
