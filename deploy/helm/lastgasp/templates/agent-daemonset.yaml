{{- if .Values.agent.enabled }}
{{- $a := .Values.agent }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lastgasp.fullname" . }}-agent
  labels:
    {{- include "lastgasp.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  # The old pod stops before the new one starts, so the new one finds the stash of the old one.
  updateStrategy:
    {{- toYaml $a.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "lastgasp.selectorLabels" (dict "ctx" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lastgasp.selectorLabels" (dict "ctx" . "component" "agent") | nindent 8 }}
        {{- with $a.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The agent reads its key once at start, so a new key restarts it.
        checksum/key: {{ .Values.key | toYaml | sha256sum }}
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if $a.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: {{ include "lastgasp.image" (dict "ctx" . "image" $a.image) }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - -server={{ include "lastgasp.agentServer" . }}
            - -key-file=/etc/lastgasp/agent.key
            # The node name, so logs are grouped by node and not by pod.
            - -hostname=$(NODE_NAME)
            {{- if not $a.pstore }}
            - -pstore=
            {{- end }}
            {{- if $a.stash }}
            - -stash=/run/lastgasp/agent.stash
            {{- else }}
            - -stash=
            {{- end }}
            {{- if not $a.forwardSecrecy }}
            - -forward-secrecy=false
            {{- end }}
            {{- with $a.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with $a.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml $a.securityContext | nindent 12 }}
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          volumeMounts:
            - name: kmsg
              mountPath: /dev/kmsg
            {{- if $a.pstore }}
            - name: pstore
              mountPath: /sys/fs/pstore
              readOnly: true
            {{- end }}
            {{- if $a.stash }}
            - name: stash
              mountPath: /run/lastgasp
            {{- end }}
            - name: key
              mountPath: /etc/lastgasp
              readOnly: true
      volumes:
        - name: kmsg
          hostPath:
            path: /dev/kmsg
            type: CharDevice
        {{- if $a.pstore }}
        - name: pstore
          hostPath:
            path: /sys/fs/pstore
            type: Directory
        {{- end }}
        {{- if $a.stash }}
        # /run on the node is tmpfs, and the stash outlives the pod.
        - name: stash
          hostPath:
            path: /run/lastgasp
            type: DirectoryOrCreate
        {{- end }}
        - name: key
          secret:
            secretName: {{ include "lastgasp.keySecretName" . }}
            items:
              - key: agent.key
                path: agent.key
            defaultMode: 0400
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
