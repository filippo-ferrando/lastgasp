{{- if and (not .Values.key.existingSecret) (or .Values.server.enabled .Values.agent.enabled) }}
{{- $name := include "lastgasp.keySecretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $old (index ($old.data | default dict) "agent.key") }}
{{- $key = index $old.data "agent.key" | b64dec }}
{{- else }}
{{- /* sha256 of a long random string gives the 64 hex characters of a 32 byte key. */}}
{{- $key = randAlphaNum 64 | sha256sum }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lastgasp.labels" . | nindent 4 }}
type: Opaque
data:
  agent.key: {{ $key | b64enc }}
  {{- if .Values.agent.enroll.tokenSecret.name }}
  keys: {{ .Values.key.extraLines | b64enc }}
  {{- else }}
  keys: {{ printf "*  %s\n%s" $key .Values.key.extraLines | b64enc }}
  {{- end }}
{{- end }}
