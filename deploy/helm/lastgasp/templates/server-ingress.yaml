{{- if and .Values.server.enabled .Values.server.ingress.enabled }}
{{- $ing := .Values.server.ingress }}
{{- $svcName := printf "%s-http" (include "lastgasp.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lastgasp.fullname" . }}
  labels:
    {{- include "lastgasp.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $ing.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
