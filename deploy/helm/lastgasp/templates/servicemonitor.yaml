{{- if and .Values.server.enabled .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $m := .Values.metrics }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lastgasp.fullname" . }}
  labels:
    {{- include "lastgasp.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with $m.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # The rules below match on job="lastgasp".
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      {{- include "lastgasp.selectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $m.serviceMonitor.interval }}
      scrapeTimeout: {{ $m.serviceMonitor.scrapeTimeout }}
      {{- if $m.requireAuth }}
      {{- if not $m.tokenSecret.name }}
      {{- fail "metrics.tokenSecret.name is required when metrics.requireAuth is set" }}
      {{- end }}
      authorization:
        type: Bearer
        credentials:
          name: {{ $m.tokenSecret.name }}
          key: {{ $m.tokenSecret.key }}
      {{- end }}
{{- end }}
