# Alerts from lastgasp have the labels alertname (LastgaspCrash, LastgaspKernelError, ...), host, kind,
# severity, rule and incident. Alerts from Prometheus about the server have alertname and severity.
route:
  receiver: ops
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Crashes and other critical incidents go to the pager as well.
    - matchers: ['severity="critical"']
      receiver: pager
      continue: true
    # Reboots are info: shown in Alertmanager, not sent anywhere.
    - matchers: ['alertname="LastgaspReboot"']
      receiver: "null"

# A crashed host is also silent for a while, the crash alert is enough.
inhibit_rules:
  - source_matchers: ['alertname="LastgaspCrash"']
    target_matchers: ['alertname="LastgaspSilent"']
    equal: [host]

receivers:
  - name: "null"
  - name: ops
