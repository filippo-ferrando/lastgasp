<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lastgasp</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
  --accent: #c2410c; --ok: #15803d; --bad: #b91c1c; --warn: #a16207;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --text: #e8e8e3; --muted: #9a9a93; --line: #33332f;
    --accent: #fb923c; --ok: #4ade80; --bad: #f87171; --warn: #facc15; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
header .sub { color: var(--muted); font-size: 13px; }
main { padding: 16px 20px; display: grid; gap: 16px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
section h2 { margin: 0; padding: 10px 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; font-size: 12px; color: var(--muted); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.up { background: var(--ok); } .down { background: var(--bad); }
.bad { color: var(--bad); font-weight: 600; } .warn { color: var(--warn); font-weight: 600; }
.muted { color: var(--muted); }
.empty { padding: 14px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
select, input, button, a.btn { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); text-decoration: none; }
button, a.btn { cursor: pointer; }
label.live { display: flex; gap: 6px; align-items: center; }
#logs { font-family: var(--mono); font-size: 12.5px; max-height: 60vh; overflow: auto; }
#logs td { white-space: pre-wrap; word-break: break-word; vertical-align: top; }
#logs td.meta { white-space: nowrap; color: var(--muted); }
.lv0, .lv1, .lv2, .lv3 { color: var(--bad); } .lv4 { color: var(--warn); } .lv7 { color: var(--muted); }
.tag { font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); }
.tag.pstore { border-color: var(--accent); color: var(--accent); }
.tag.netconsole { border-color: var(--warn); color: var(--warn); }
.ranges { font-family: var(--mono); font-size: 12px; white-space: normal; }
.sev { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.sev-critical { color: var(--bad); } .sev-warning { color: var(--warn); } .sev-info { color: var(--muted); }
td.summary { white-space: nowrap; max-width: 60ch; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 12px; }
tr.closed td { opacity: .6; }
dialog { width: min(1100px, 96vw); max-height: 90vh; padding: 0; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text); }
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog .head { display: flex; gap: 12px; align-items: baseline; padding: 12px 14px; border-bottom: 1px solid var(--line); }
dialog .head h3 { margin: 0; font-size: 15px; flex: 1; }
dialog .body { padding: 0 14px 14px; overflow: auto; max-height: calc(90vh - 60px); }
dialog h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dialog pre { margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 45vh; overflow: auto; }
pre .ln { display: block; }
pre .hit, tr.hit td { background: color-mix(in srgb, var(--bad) 22%, transparent); }
button:hover:not(:disabled), a.btn:hover, select:hover, input:hover { border-color: var(--muted); }
button:focus-visible, a.btn:focus-visible, select:focus-visible, input:focus-visible, tr.click:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.grow { flex: 1; }
#status.bad { color: var(--bad); }
.chip { font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.hostlink { cursor: pointer; }
.hostlink:hover { color: var(--accent); }
.jump { position: sticky; bottom: 8px; display: flex; justify-content: center; pointer-events: none; }
.jump button { pointer-events: auto; font-family: system-ui, sans-serif; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
.msg { margin: 10px 0 0; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--bad); color: var(--bad); }
dialog .head button { white-space: nowrap; }
#logs td.meta { width: 1%; }
dialog .head { flex-wrap: wrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.actions input[type=text] { flex: 1; min-width: 12ch; }
.ok-msg { color: var(--ok); }
.cmd { display: flex; gap: 8px; align-items: stretch; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.cmd pre { flex: 1; margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; }
.note { padding: 0 14px 10px; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) {
  header, main { padding-left: 10px; padding-right: 10px; }
  #logs td { padding: 4px 6px; }
  dialog .head h3 { flex-basis: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>last<span>gasp</span></h1>
  <div class="sub" id="status">loading</div>
  <div class="sub" id="who" style="margin-left:auto"></div>
  <button id="logout" hidden title="End this login">log out</button>
</header>
<main>
  <section>
    <h2><span>Incidents <span class="chip" id="inc-count"></span></span>
      <label class="live chip"><input type="checkbox" id="inc-open"> open only</label></h2>
    <div class="scroll" id="incidents"></div>
  </section>

  <section>
    <h2>Silences <span class="chip" id="sil-count"></span></h2>
    <div class="actions" id="sil-form" hidden>
      <input id="sil-host" type="text" list="sil-hosts" placeholder="host or pattern, like db-* or *" aria-label="host or pattern">
      <datalist id="sil-hosts"></datalist>
      <select id="sil-kind" aria-label="incident kind"><option value="">every kind</option></select>
      <select id="sil-dur" aria-label="duration"><option>30m</option><option selected>1h</option><option>4h</option><option>24h</option><option>168h</option></select>
      <input id="sil-comment" type="text" placeholder="comment, like kernel update" aria-label="comment">
      <button id="sil-add" class="primary">add silence</button>
    </div>
    <div class="scroll" id="silences"></div>
  </section>

  <section id="agents-section" hidden>
    <h2>Agents <span class="chip" id="agent-count"></span></h2>
    <div class="actions">
      <input id="tok-comment" type="text" placeholder="comment, like rack 4" aria-label="token comment">
      <select id="tok-uses" aria-label="uses"><option value="1" selected>1 agent</option><option value="10">10 agents</option><option value="0">any number of agents</option></select>
      <select id="tok-ttl" aria-label="valid for"><option value="1h">for 1 hour</option><option value="24h" selected>for 24 hours</option><option value="168h">for 7 days</option><option value="8760h">for 1 year</option></select>
      <button id="tok-add" class="primary" title="A join token lets new agents get their own key">add agents</button>
    </div>
    <div id="tok-new" hidden>
      <div class="cmd"><pre id="tok-cmd"></pre><button id="tok-copy">copy</button></div>
      <div class="note" id="tok-note"></div>
    </div>
    <div class="scroll" id="tokens"></div>
    <div class="scroll" id="agents"></div>
  </section>

  <section>
    <h2>Hosts <span class="chip" id="hostcount"></span></h2>
    <div class="scroll" id="hosts"></div>
  </section>

  <section>
    <h2>Missing packets <span class="chip" id="gapnote"></span></h2>
    <div class="scroll" id="gaps"></div>
  </section>

  <section id="logs-section">
    <h2>Logs <span class="chip" id="logcount"></span></h2>
    <div class="filters">
      <select id="f-host" aria-label="host"><option value="">all hosts</option></select>
      <select id="f-level" aria-label="level">
        <option value="">all levels</option>
        <option value="0">emerg</option><option value="1">alert and above</option>
        <option value="2">crit and above</option><option value="3">err and above</option>
        <option value="4">warning and above</option><option value="5">notice and above</option>
        <option value="6">info and above</option>
      </select>
      <select id="f-source" aria-label="source"><option value="">all sources</option><option value="kmsg">kmsg</option><option value="pstore">pstore</option><option value="netconsole">netconsole</option></select>
      <input id="f-q" type="search" placeholder="search text" aria-label="search text" title="Press / to search, Escape to clear">
      <input id="f-boot" type="hidden">
      <button id="f-boot-chip" hidden title="Show every boot"></button>
      <button id="f-clear" hidden>clear filters</button>
      <span class="grow"></span>
      <label class="live" title="Add new lines as they arrive"><input type="checkbox" id="f-live" checked> live</label>
      <button id="more" title="Load 300 older lines">older</button>
      <a class="btn" id="download" href="/api/download" title="Save all matching lines as NDJSON">download</a>
    </div>
    <div id="logs"><table><tbody id="logrows"></tbody></table>
      <div class="jump"><button id="jump" hidden></button></div></div>
  </section>
</main>
<dialog id="inc-dialog" aria-labelledby="inc-title">
  <div class="head"><h3 id="inc-title"></h3>
    <button id="inc-copy" title="Copy a link to this incident">copy link</button>
    <button id="inc-logs" title="Show the logs of this boot at the incident">show logs</button>
    <button id="inc-ack" class="primary">acknowledge</button>
    <button id="inc-close" title="Close (Escape)">close</button></div>
  <div class="actions" id="inc-actions" hidden>
    <input id="inc-note" type="text" maxlength="1000" placeholder="note, saved with acknowledge or resolve" aria-label="note">
    <button id="inc-resolve" title="Close the incident as resolved and tell the targets that got an alert">resolve</button>
    <select id="inc-sil-dur" aria-label="silence duration"><option>1h</option><option>4h</option><option>24h</option></select>
    <button id="inc-silence" title="Hold back new alerts of this host">silence host</button>
  </div>
  <div class="body"><div class="msg" id="inc-msg" hidden></div><div id="inc-body"></div></div>
</dialog>
<script>
const LEVELS = ["emerg", "alert", "crit", "err", "warning", "notice", "info", "debug"];
const KINDS = {crash: "crash", reboot: "reboot", silent: "silent", kernel_error: "kernel error", server: "server", flapping: "flapping"};
const PAGE = 300;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmtNum = n => Number(n).toLocaleString();
const ago = t => {
  const s = Math.max(0, (Date.now() - new Date(t)) / 1000);
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const tsFmt = us => (us / 1e6).toFixed(6).padStart(13, " ");
// Age cells are filled by tickAges, so a table only changes when its data changes.
const age = t => `<td class="muted" data-t="${esc(t)}" title="${esc(new Date(t).toLocaleString())}"></td>`;

function tickAges() {
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = ago(el.dataset.t);
}

class HTTPError extends Error {
  constructor(status, text) { super(text || "HTTP " + status); this.status = status; }
}

// copyText puts text on the clipboard. The Clipboard API only exists on HTTPS and localhost, so plain
// HTTP uses a selected textarea, placed next to the button as a modal dialog makes the rest inert.
async function copyText(text, button) {
  if (window.isSecureContext && navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
  (button.parentElement || document.body).appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  button.focus();
  return ok;
}

// copyButton copies text and says how it went on the button. When the browser refuses, a prompt
// shows the text selected, ready for Ctrl+C.
async function copyButton(button, text, label) {
  const ok = await copyText(text, button);
  if (!ok) window.prompt("Copy with Ctrl+C:", text);
  button.textContent = ok ? "copied" : label;
  setTimeout(() => { button.textContent = label; }, 1500);
}

// A 401 means the login ended, for example after -session-ttl, so the login page takes over.
function toLogin() {
  location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search + location.hash);
}

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) toLogin();
  if (!r.ok) throw new HTTPError(r.status, (await r.text()).trim());
  return r.json();
}

// render replaces the content of el only when it changed, and not while text in it is selected.
// The focused row keeps the focus.
function render(el, html) {
  if (el.lastHTML === html) return;
  const sel = getSelection();
  if (sel && !sel.isCollapsed && el.contains(sel.anchorNode)) return;
  const f = document.activeElement;
  const key = f && el.contains(f) ? f.dataset.key : null;
  el.innerHTML = html;
  el.lastHTML = html;
  if (key) el.querySelector(`[data-key="${CSS.escape(key)}"]`)?.focus();
}

// Filters live in the address, so a view can be shared and survives a reload.
const FILTERS = [["host", "f-host"], ["boot", "f-boot"], ["level", "f-level"], ["source", "f-source"], ["q", "f-q"]];

function filterQuery() {
  const p = new URLSearchParams();
  for (const [k, id] of FILTERS) if ($(id).value) p.set(k, $(id).value);
  return p;
}

function saveFilters() {
  const p = filterQuery();
  if ($("inc-open").checked) p.set("open", "1");
  const q = p.toString();
  history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash);
  $("f-clear").hidden = !filterQuery().toString();
  $("f-boot-chip").hidden = !$("f-boot").value;
  $("f-boot-chip").textContent = "boot " + $("f-boot").value.slice(0, 8) + " \u00d7";
  $("download").href = "/api/download?" + filterQuery();
}

function setHostOption(host) {
  const sel = $("f-host");
  if (host && ![...sel.options].some(o => o.value === host)) sel.add(new Option(host, host));
}

function loadFilters() {
  const p = new URLSearchParams(location.search);
  setHostOption(p.get("host"));
  for (const [k, id] of FILTERS) $(id).value = p.get(k) || "";
  $("inc-open").checked = p.get("open") === "1";
  saveFilters();
}

// A boot belongs to one host, so its filter goes when the host changes.
function setHost(host) {
  setHostOption(host);
  if ($("f-host").value !== host) $("f-boot").value = "";
  $("f-host").value = host;
  filtersChanged();
}

function filtersChanged() {
  saveFilters();
  reloadLogs();
  refresh();
}

// Hosts

async function loadHosts() {
  const hosts = await getJSON("/api/hosts");
  render($("sil-hosts"), hosts.map(h => `<option value="${esc(h.host)}">`).join(""));
  $("hostcount").textContent = hosts.length ? hosts.filter(h => h.up).length + " of " + hosts.length + " up" : "";
  for (const h of hosts) setHostOption(h.host);
  if (!hosts.length) return render($("hosts"), '<div class="empty">No agent has sent anything yet.</div>');
  const cls = (v, c) => v > 0 ? ` class="num ${c}"` : ' class="num"';
  const cur = $("f-host").value;
  render($("hosts"), `<table><tr><th>Host</th><th>Last seen</th><th>Boots</th><th class="num">Received</th>
    <th class="num" title="Packets that never arrived">Missing</th><th class="num" title="Packets that arrived out of order or were sent again">Late</th>
    <th class="num">Duplicates</th><th class="num" title="Dropped by the agent because its buffer was full">Agent drops</th>
    <th class="num" title="Kernel overwrote records before the agent read them">Kernel overruns</th>
    <th class="num">Send errors</th><th class="num" title="Records the agent holds until a server confirms them">Buffered</th>
    <th title="Version of the newest agent run">Agent</th>
    <th class="num" title="Packet version of the newest agent run. Version 5 has forward secrecy">Wire</th></tr>` +
    hosts.map(h => `<tr class="click${cur === h.host ? " sel" : ""}" tabindex="0" data-key="${esc(h.host)}"
      title="${cur === h.host ? "Show all hosts" : "Show only " + esc(h.host)}" aria-pressed="${cur === h.host}">
      <td><span class="dot ${h.up ? "up" : "down"}" title="${h.up ? "up" : "down"}"></span>${esc(h.host)}</td>
      ${age(h.last_seen)}
      <td class="num">${h.boots}</td>
      <td class="num">${fmtNum(h.received)}</td>
      <td${cls(h.missing, "bad")}>${fmtNum(h.missing)}</td>
      <td class="num">${fmtNum(h.recovered)}</td>
      <td class="num">${fmtNum(h.duplicates)}</td>
      <td${cls(h.agent.BufferDrops, "bad")}>${fmtNum(h.agent.BufferDrops)}</td>
      <td${cls(h.agent.KmsgOverruns, "warn")}>${fmtNum(h.agent.KmsgOverruns)}</td>
      <td${cls(h.agent.SendErrors, "warn")}>${fmtNum(h.agent.SendErrors)}</td>
      <td class="num">${fmtNum(h.agent.Buffered)}</td>
      <td class="muted${h.agent_version && h.agent_version !== serverVersion ? " warn" : ""}"
        title="${h.agent_version && h.agent_version !== serverVersion ? "Not the server version " + esc(serverVersion) : ""}">${esc(h.agent_version || "old")}</td>
      <td class="num${h.wire_version && h.wire_version < 5 ? " warn" : ""}"
        title="${h.wire_version && h.wire_version < 5 ? "No forward secrecy: an old agent, or -wait-ack=false or -forward-secrecy=false" : ""}">${h.wire_version || "?"}</td></tr>`).join("") + "</table>");
}

// Missing packets

async function loadGaps() {
  const host = $("f-host").value;
  const streams = await getJSON("/api/streams" + (host ? "?host=" + encodeURIComponent(host) : ""));
  $("gapnote").textContent = host ? "of " + host : "";
  if (!streams.length) return render($("gaps"), '<div class="empty">No missing packets.</div>');
  const show = rs => {
    const parts = rs.slice(-20).map(r => r.from === r.to ? r.from : r.from + "-" + r.to);
    return (rs.length > 20 ? "... " : "") + parts.join(", ");
  };
  render($("gaps"), `<table><tr><th>Host</th><th>Boot</th><th>Agent run</th><th>Last seen</th>
    <th class="num">Missing</th><th class="num">Highest seq</th><th>Missing sequence numbers</th></tr>` +
    streams.map(s => `<tr><td>${esc(s.host)}</td><td class="muted" title="${esc(s.boot_id)}">${esc(s.boot_id.slice(0, 8))}</td>
      <td class="muted">${esc(s.instance)}</td>${age(s.last_seen)}
      <td class="num bad">${fmtNum(s.gaps - s.recovered)}</td><td class="num">${fmtNum(s.max_seq)}</td>
      <td class="ranges">${esc(show(s.missing_ranges))}</td></tr>`).join("") + "</table>");
}

// Logs. gen grows on every filter change, so answers to older requests are thrown away.

// anchor is a record to load the view around and mark, set by "show logs" of an incident.
const logs = {gen: 0, newest: 0, oldest: 0, noOlder: false, loadingOlder: false, unseen: 0, anchor: 0, mark: 0};

function logRow(r) {
  const part = r.parts > 1 ? ` <span class="tag">part ${r.part}/${r.parts}</span>` : "";
  const src = r.source === "pstore" ? ' <span class="tag pstore" title="Saved by the kernel before a crash or reboot">pstore</span>'
    : r.source === "netconsole" ? ' <span class="tag netconsole" title="Sent by the kernel netconsole as plain text, not by the agent: not authenticated">netconsole</span>' : "";
  return `<tr${r.id === logs.mark ? ' class="hit"' : ""}><td class="meta hostlink" data-host="${esc(r.host)}" title="Show only ${esc(r.host)}">${esc(r.host)}</td>
    <td class="meta" title="boot ${esc(r.boot_id)}, received ${esc(new Date(r.received_at).toLocaleString())}">[${tsFmt(r.ts_usec)}]</td>
    <td class="meta lv${r.level}">${LEVELS[r.level]}</td><td class="lv${r.level}">${esc(r.message)}${part}${src}</td></tr>`;
}

const atBottom = () => { const b = $("logs"); return b.scrollHeight - b.scrollTop - b.clientHeight < 40; };

function toBottom() {
  $("logs").scrollTop = $("logs").scrollHeight;
  logs.unseen = 0;
  updateLogUI();
}

function updateLogUI() {
  const n = $("logrows").dataset.empty ? 0 : $("logrows").rows.length;
  $("logcount").textContent = fmtNum(n) + " shown" + ($("f-live").checked ? "" : ", paused");
  const more = $("more");
  more.disabled = logs.loadingOlder || logs.noOlder || !logs.oldest;
  more.textContent = logs.loadingOlder ? "loading..." : logs.noOlder && n ? "no older lines" : "older";
  $("jump").hidden = !logs.unseen;
  $("jump").textContent = "jump to newest (" + fmtNum(logs.unseen) + " new)";
}

async function reloadLogs() {
  const gen = ++logs.gen;
  const p = filterQuery();
  p.set("limit", PAGE);
  logs.mark = logs.anchor;
  logs.anchor = 0;
  let recs;
  try {
    if (logs.mark) {
      // Newest first like a normal page: the lines after the anchor, then the anchor and the ones before it.
      const after = new URLSearchParams(p), before = new URLSearchParams(p);
      after.set("after_id", logs.mark);
      before.set("before_id", logs.mark + 1);
      const [a, b] = await Promise.all([getJSON("/api/logs?" + after), getJSON("/api/logs?" + before)]);
      recs = a.reverse().concat(b);
    } else {
      recs = await getJSON("/api/logs?" + p);
    }
  } catch (e) {
    if (gen === logs.gen) setStatus(e);
    return;
  }
  if (gen !== logs.gen) return;
  $("logrows").innerHTML = recs.length ? recs.slice().reverse().map(logRow).join("")
    : `<tr><td class="empty">${filterQuery().toString() ? "No lines match these filters." : "No lines yet."}</td></tr>`;
  if (!recs.length) $("logrows").dataset.empty = "1"; else delete $("logrows").dataset.empty;
  logs.newest = recs.length ? recs[0].id : 0;
  logs.oldest = recs.length ? recs[recs.length - 1].id : 0;
  logs.noOlder = recs.length < PAGE;
  logs.loadingOlder = false;
  const hit = $("logrows").querySelector("tr.hit");
  if (hit) {
    hit.scrollIntoView({block: "center"});
    updateLogUI();
  } else toBottom();
}

async function pollLogs() {
  if (!$("f-live").checked) return;
  // after_id=0 means no filter on the server, so an empty view loads like a fresh page.
  if (!logs.newest) return reloadLogs();
  const gen = logs.gen;
  const p = filterQuery();
  p.set("after_id", logs.newest);
  const recs = await getJSON("/api/logs?" + p);
  if (gen !== logs.gen || !recs.length) return;
  const bottom = atBottom();
  $("logrows").insertAdjacentHTML("beforeend", recs.map(logRow).join(""));
  logs.newest = recs[recs.length - 1].id;
  if (bottom) toBottom();
  else { logs.unseen += recs.length; updateLogUI(); }
}

async function loadOlder() {
  if (!logs.oldest || logs.loadingOlder) return;
  const gen = logs.gen;
  logs.loadingOlder = true;
  updateLogUI();
  const p = filterQuery();
  p.set("before_id", logs.oldest);
  p.set("limit", PAGE);
  try {
    const recs = await getJSON("/api/logs?" + p);
    if (gen !== logs.gen) return;
    const box = $("logs"), h = box.scrollHeight;
    $("logrows").insertAdjacentHTML("afterbegin", recs.slice().reverse().map(logRow).join(""));
    if (recs.length) logs.oldest = recs[recs.length - 1].id;
    logs.noOlder = recs.length < PAGE;
    box.scrollTop += box.scrollHeight - h;
  } catch (e) {
    setStatus(e);
  } finally {
    if (gen === logs.gen) logs.loadingOlder = false;
    updateLogUI();
  }
}

// Incidents

const state = i => [i.closed_at ? (i.resolved ? "resolved" : "closed") : "open", i.acked_at ? "seen" + (i.acked_by ? " by " + i.acked_by : "") : "",
  ...(i.alerts || []).map(a => a.target + " " + a.state)].filter(Boolean).map(esc).join(", ");

async function loadIncidents() {
  const p = new URLSearchParams({limit: 50});
  if ($("f-host").value) p.set("host", $("f-host").value);
  if ($("inc-open").checked) p.set("open", "1");
  const list = await getJSON("/api/incidents?" + p);
  const open = list.filter(i => !i.closed_at).length;
  $("inc-count").textContent = list.length ? open + " open" + ($("f-host").value ? " on " + $("f-host").value : "") : "";
  if (!list.length) {
    return render($("incidents"), `<div class="empty">${$("inc-open").checked ? "No open incidents." : "No incidents."}</div>`);
  }
  // Incidents of several hosts at once share a group. The tag names the hosts of the group in this list.
  const groups = {};
  for (const i of list) if (i.group_id) (groups[i.group_id] ||= []).push(i.host);
  const groupTag = i => {
    if (!i.group_id) return "";
    const n = groups[i.group_id].length - 1;
    return ` <span class="tag" title="Same kind on several hosts at once: ${esc(groups[i.group_id].join(", "))}">${
      n ? "with " + fmtNum(n) + " more" : "group"}</span>`;
  };
  render($("incidents"), `<table><tr><th>Severity</th><th>Opened</th><th>Host</th><th>Kind</th>
    <th class="num">Count</th><th>State</th><th>Summary</th></tr>` +
    list.map(i => `<tr class="click${i.closed_at ? " closed" : ""}" tabindex="0" data-key="${i.id}" title="Open incident ${i.id}">
      <td class="sev sev-${esc(i.severity)}">${esc(i.severity)}</td>
      ${age(i.opened_at)}
      <td>${esc(i.host)}</td><td>${esc(KINDS[i.kind] || i.kind)}${i.rule ? ` <span class="tag">${esc(i.rule)}</span>` : ""}${groupTag(i)}</td>
      <td class="num">${fmtNum(i.count)}</td>
      <td class="muted">${state(i)}</td>
      <td class="summary" title="${esc(i.summary)}">${esc(i.summary)}</td></tr>`).join("") + "</table>");
}

// Silences

const postJSON = (url, body, method = "POST") =>
  getJSON(url, {method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});

async function loadSilences() {
  const list = await getJSON("/api/silences");
  const now = Date.now();
  const active = list.filter(s => new Date(s.starts_at) <= now).length;
  $("sil-count").textContent = list.length ? active + " active" + (list.length > active ? ", " + (list.length - active) + " upcoming" : "") : "";
  if (!list.length) return render($("silences"), '<div class="empty">No silences. A silence holds back alerts, for example during maintenance.</div>');
  render($("silences"), `<table><tr><th>Host</th><th>Kind</th><th>From</th><th>Until</th><th>Comment</th><th>By</th><th></th></tr>` +
    list.map(s => `<tr><td>${esc(s.host)}</td><td>${esc(s.kind ? KINDS[s.kind] || s.kind : "every kind")}</td>
      <td class="muted">${esc(new Date(s.starts_at).toLocaleString())}</td><td class="muted">${esc(new Date(s.ends_at).toLocaleString())}</td>
      <td>${esc(s.comment)}</td><td class="muted">${esc(s.created_by)}</td>
      <td>${isAdmin ? `<button data-end="${s.id}" data-key="end-${s.id}">end now</button>` : ""}</td></tr>`).join("") + "</table>");
}

async function addSilence(host, kind, duration, comment) {
  await postJSON("/api/silences", {host, kind, duration, comment});
  loadSilences().catch(setStatus);
}

$("sil-add").onclick = async () => {
  const b = $("sil-add");
  b.disabled = true;
  try {
    await addSilence($("sil-host").value.trim(), $("sil-kind").value, $("sil-dur").value, $("sil-comment").value.trim());
    $("sil-host").value = $("sil-comment").value = "";
  } catch (e) {
    alert("Silence not added: " + e.message);
  } finally {
    b.disabled = false;
  }
};
$("silences").onclick = async e => {
  const b = e.target.closest("button[data-end]");
  if (!b) return;
  b.disabled = true;
  try {
    const r = await fetch("/api/silences/" + b.dataset.end, {method: "DELETE"});
    if (!r.ok) throw new HTTPError(r.status, (await r.text()).trim());
    loadSilences().catch(setStatus);
  } catch (e) {
    b.disabled = false;
    alert("Silence not ended: " + e.message);
  }
};
for (const [k, v] of Object.entries(KINDS)) $("sil-kind").add(new Option(v, k));

// Agents: join tokens and enrolled hosts, for admins.

async function loadAgents() {
  if (!isAdmin) return;
  let tokens, agents;
  try {
    [tokens, agents] = await Promise.all([getJSON("/api/enroll-tokens"), getJSON("/api/agents")]);
  } catch (e) {
    // A viewer, before /api/me said so.
    if (e.status === 403) { $("agents-section").hidden = true; return; }
    throw e;
  }
  const now = Date.now();
  const usable = t => !t.revoked && t.uses_left !== 0 && new Date(t.expires_at) > now;
  $("agent-count").textContent = agents.length + " enrolled" + (tokens.filter(usable).length ? ", " + tokens.filter(usable).length + " usable tokens" : "");
  const shownTokens = tokens.filter(t => usable(t) || now - new Date(t.expires_at) < 864e5);
  render($("tokens"), shownTokens.length ? `<table><tr><th>Join token</th><th>Comment</th><th class="num">Used</th><th>Uses left</th>
    <th>Valid until</th><th>By</th><th></th></tr>` + shownTokens.map(t => `<tr${usable(t) ? "" : ' class="closed"'}>
      <td class="muted">#${t.id}${t.revoked ? " (revoked)" : ""}</td><td>${esc(t.comment)}</td><td class="num">${t.used}</td>
      <td>${t.uses_left < 0 ? "no limit" : t.uses_left}</td><td class="muted">${esc(new Date(t.expires_at).toLocaleString())}</td>
      <td class="muted">${esc(t.created_by)}</td>
      <td>${usable(t) ? `<button data-revoke-token="${t.id}" data-key="tok-${t.id}">revoke</button>` : ""}</td></tr>`).join("") + "</table>" : "");
  render($("agents"), agents.length ? `<table><tr><th>Enrolled host</th><th>Enrolled</th><th>From</th><th class="num">Token</th><th></th></tr>` +
    agents.map(a => `<tr><td>${esc(a.host)}</td>${age(a.enrolled_at)}<td class="muted">${esc(a.from)}</td>
      <td class="num muted">#${a.token_id}</td>
      <td><button data-revoke-agent="${esc(a.host)}" data-key="agent-${esc(a.host)}" title="Refuse packets with this key">revoke key</button></td></tr>`).join("") + "</table>"
    : '<div class="empty">No agent enrolled yet. "add agents" makes a join token and the command that installs an agent with it.</div>');
}

$("tok-add").onclick = async () => {
  const b = $("tok-add");
  b.disabled = true;
  try {
    const r = await postJSON("/api/enroll-tokens", {comment: $("tok-comment").value.trim(), uses: +$("tok-uses").value, ttl: $("tok-ttl").value});
    $("tok-cmd").textContent = r.install;
    $("tok-note").textContent = "Run it as root on each new host. The token is shown only now" +
      (r.agent_address ? "." : ". Replace SERVER:5140 with the address agents reach the server on, or start the server with -agent-address.");
    $("tok-new").hidden = false;
    $("tok-comment").value = "";
    loadAgents().catch(setStatus);
  } catch (e) {
    alert("Token not created: " + e.message);
  } finally {
    b.disabled = false;
  }
};
$("tok-copy").onclick = () => copyButton($("tok-copy"), $("tok-cmd").textContent, "copy");
$("agents-section").onclick = async e => {
  const tb = e.target.closest("button[data-revoke-token]"), ab = e.target.closest("button[data-revoke-agent]");
  if (!tb && !ab) return;
  if (ab && !confirm("Revoke the key of " + ab.dataset.revokeAgent + "? Its packets are refused until it enrolls again.")) return;
  const url = tb ? "/api/enroll-tokens/" + tb.dataset.revokeToken : "/api/agents/" + encodeURIComponent(ab.dataset.revokeAgent);
  try {
    const r = await fetch(url, {method: "DELETE"});
    if (!r.ok) throw new HTTPError(r.status, (await r.text()).trim());
    loadAgents().catch(setStatus);
  } catch (err) {
    alert("Not revoked: " + err.message);
  }
};

let shown = null, isAdmin = true, serverVersion = "";

async function loadMe() {
  const me = await getJSON("/api/me");
  isAdmin = me.role === "admin";
  serverVersion = me.version;
  $("sil-form").hidden = !isAdmin;
  $("agents-section").hidden = !isAdmin;
  $("who").textContent = (me.auth ? me.user + " (" + me.role + "), " : "") + "server " + me.version;
  $("logout").hidden = !me.session;
}

function incidentMsg(text) {
  $("inc-msg").hidden = !text;
  $("inc-msg").textContent = text || "";
}

function setAckButton(i) {
  $("inc-actions").hidden = !isAdmin || !i;
  if (i) {
    $("inc-resolve").disabled = i.resolved || (!i.closed_at && (i.kind === "reboot" || i.kind === "silent"));
    $("inc-resolve").title = i.resolved ? "Already resolved" : !i.closed_at && i.kind === "reboot" ? "Waiting for the crash check" :
      !i.closed_at && i.kind === "silent" ? "Closes when the host sends again, use a silence instead" :
      "Close the incident as resolved and tell the targets that got an alert";
    $("inc-silence").disabled = i.host === "@server";
  }
  const b = $("inc-ack");
  b.hidden = !isAdmin || !i;
  b.disabled = !i || !!i.acked_at;
  b.textContent = i && i.acked_at ? "acknowledged" : "acknowledge";
  b.title = i && i.acked_at ? "Seen " + new Date(i.acked_at).toLocaleString() : "Mark as seen";
}

async function showIncident(id) {
  if (!$("inc-dialog").open || !shown || shown.id !== +id) {
    shown = null;
    $("inc-title").textContent = "Incident " + id;
    $("inc-body").innerHTML = '<div class="empty">loading</div>';
    for (const b of ["inc-copy", "inc-logs"]) $(b).disabled = true;
    $("inc-note").value = "";
    setAckButton(null);
    incidentMsg("");
    if (!$("inc-dialog").open) $("inc-dialog").showModal();
  }
  let v;
  try {
    v = await getJSON("/api/incidents/" + id);
  } catch (e) {
    $("inc-body").innerHTML = "";
    return incidentMsg(e.status === 404 ? "Incident " + id + " does not exist, retention may have removed it." : "Cannot load the incident: " + e.message);
  }
  if (location.hash !== "#incident=" + id) return;
  const i = v.incident;
  shown = i;
  for (const b of ["inc-copy", "inc-logs"]) $(b).disabled = false;
  setAckButton(i);
  $("inc-title").innerHTML = `<span class="sev sev-${esc(i.severity)}">${esc(i.severity)}</span>
    ${esc(i.host)}: ${esc(KINDS[i.kind] || i.kind)}${i.rule ? " (" + esc(i.rule) + ")" : ""}`;
  const line = r => `<span class="ln${r.message === i.summary || r.id === i.last_record_id && i.kind === "kernel_error" ? " hit" : ""}">` +
    `[${tsFmt(r.ts_usec)}] ${esc(LEVELS[r.level] || "")} ${esc(r.message)}</span>`;
  const block = rs => rs.map(line).join("");
  $("inc-body").innerHTML = `<h4>Summary</h4><pre>${esc(i.summary)}</pre>
    <h4>Details</h4><div class="muted">boot ${esc(i.boot_id)}, opened ${esc(new Date(i.opened_at).toLocaleString())}${i.closed_at ?
      ", closed " + esc(new Date(i.closed_at).toLocaleString()) : ", still open"}, count ${fmtNum(i.count)}<br>${state(i)}</div>` +
    (i.note ? `<h4>Note</h4><pre>${esc(i.note)}</pre>` : "") +
    (v.pstore.length ? `<h4>Saved by the kernel before the reboot (pstore, ${fmtNum(v.pstore.length)} lines)</h4><pre>${block(v.pstore)}</pre>` : "") +
    `<h4>Last kernel lines received (${fmtNum(v.records.length)})</h4>` +
    (v.records.length ? `<pre id="inc-tail">${block(v.records)}</pre>` : '<div class="empty">No lines received for this boot.</div>') +
    (v.after.length ? `<h4>Next lines received (${fmtNum(v.after.length)})</h4><pre>${block(v.after)}</pre>` : "");
  const tail = $("inc-tail");
  if (tail) tail.scrollTop = tail.scrollHeight;
}

function closeIncident() {
  if ($("inc-dialog").open) $("inc-dialog").close();
}

function route() {
  const m = location.hash.match(/^#incident=(\d+)$/);
  if (m) showIncident(m[1]);
  else closeIncident();
}

$("logout").onclick = async () => {
  await fetch("/api/logout", {method: "POST"}).catch(() => {});
  location.href = "/login";
};
$("inc-close").onclick = closeIncident;
$("inc-dialog").onclose = () => {
  shown = null;
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
};
// A click on the backdrop lands on the dialog itself, outside its box.
$("inc-dialog").onclick = e => {
  const r = $("inc-dialog").getBoundingClientRect();
  if (e.target === $("inc-dialog") && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) closeIncident();
};
$("inc-ack").onclick = async () => {
  if (!shown) return;
  const b = $("inc-ack"), id = shown.id;
  b.disabled = true;
  b.textContent = "saving...";
  incidentMsg("");
  try {
    const i = await postJSON("/api/incidents/" + id + "/ack", {note: $("inc-note").value.trim()});
    if (shown && shown.id === id) { $("inc-note").value = ""; showIncident(id); }
    loadIncidents().catch(() => {});
  } catch (e) {
    setAckButton(shown);
    incidentMsg(e.status === 403 ? "Only admins can acknowledge incidents." : "Not acknowledged: " + e.message);
  }
};
$("inc-resolve").onclick = async () => {
  if (!shown) return;
  const id = shown.id;
  $("inc-resolve").disabled = true;
  incidentMsg("");
  try {
    await postJSON("/api/incidents/" + id + "/resolve", {note: $("inc-note").value.trim()});
    if (shown && shown.id === id) { $("inc-note").value = ""; showIncident(id); }
    loadIncidents().catch(() => {});
  } catch (e) {
    setAckButton(shown);
    incidentMsg("Not resolved: " + e.message);
  }
};
$("inc-silence").onclick = async () => {
  if (!shown) return;
  const b = $("inc-silence"), dur = $("inc-sil-dur").value;
  b.disabled = true;
  incidentMsg("");
  try {
    await addSilence(shown.host, "", dur, $("inc-note").value.trim() || "from incident " + shown.id);
    b.textContent = "silenced for " + dur;
    setTimeout(() => { b.textContent = "silence host"; b.disabled = false; }, 2000);
  } catch (e) {
    b.disabled = false;
    incidentMsg("Not silenced: " + e.message);
  }
};
$("inc-copy").onclick = () => copyButton($("inc-copy"), location.href, "copy link");
$("inc-logs").onclick = () => {
  if (!shown) return;
  const {host, boot_id, last_record_id} = shown;
  closeIncident();
  $("f-level").value = $("f-source").value = $("f-q").value = "";
  setHostOption(host);
  $("f-host").value = host;
  $("f-boot").value = boot_id || "";
  logs.anchor = last_record_id || 0;
  filtersChanged();
  $("logs-section").scrollIntoView({behavior: "smooth"});
};

// Rows act on click, Enter and Space.

function onActivate(el, fn) {
  el.addEventListener("click", e => fn(e.target, e));
  el.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[tabindex]")) { e.preventDefault(); fn(e.target, e); }
  });
}

onActivate($("incidents"), t => {
  const tr = t.closest("tr.click");
  if (tr && !getSelection().toString()) location.hash = "incident=" + tr.dataset.key;
});
onActivate($("hosts"), t => {
  const tr = t.closest("tr.click");
  if (tr && !getSelection().toString()) setHost($("f-host").value === tr.dataset.key ? "" : tr.dataset.key);
});
onActivate($("logrows"), t => {
  const td = t.closest(".hostlink");
  if (td && !getSelection().toString()) setHost(td.dataset.host);
});

// Status and refresh

function setStatus(e) {
  $("status").classList.toggle("bad", !!e);
  $("status").textContent = e ? (e.status ? "server error: " + e.message : "server not reachable, retrying") :
    "updated " + new Date().toLocaleTimeString();
}

let timer, running = false, again = false;

async function refresh() {
  clearTimeout(timer);
  // A refresh asked for while one runs, after a filter change, runs right after it.
  if (running) { again = true; return; }
  running = true;
  again = false;
  try {
    await Promise.all([loadIncidents(), loadSilences(), loadAgents(), loadHosts(), loadGaps(), pollLogs()]);
    setStatus(null);
  } catch (e) {
    setStatus(e);
  } finally {
    running = false;
    tickAges();
    // Hidden tabs do not poll; the refresh runs again when the tab is shown.
    if (!document.hidden) timer = setTimeout(refresh, again ? 0 : 2000);
  }
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

for (const id of ["f-level", "f-source"]) $(id).onchange = filtersChanged;
$("f-host").onchange = () => { $("f-boot").value = ""; filtersChanged(); };
let typing;
$("f-q").oninput = () => { clearTimeout(typing); typing = setTimeout(filtersChanged, 300); };
$("f-q").onkeydown = e => {
  if (e.key === "Enter") { clearTimeout(typing); filtersChanged(); }
  if (e.key === "Escape" && $("f-q").value) { e.preventDefault(); $("f-q").value = ""; clearTimeout(typing); filtersChanged(); }
};
$("f-boot-chip").onclick = () => { $("f-boot").value = ""; filtersChanged(); };
$("f-clear").onclick = () => {
  for (const [, id] of FILTERS) $(id).value = "";
  filtersChanged();
};
$("inc-open").onchange = () => { saveFilters(); loadIncidents().catch(setStatus); };
$("f-live").onchange = () => { if ($("f-live").checked) pollLogs().catch(setStatus); updateLogUI(); };
$("more").onclick = loadOlder;
$("jump").onclick = toBottom;
$("logs").onscroll = () => { if (logs.unseen && atBottom()) { logs.unseen = 0; updateLogUI(); } };
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.target.matches("input, select, textarea") && !$("inc-dialog").open) { e.preventDefault(); $("f-q").focus(); }
});
window.onhashchange = route;

loadFilters();
loadMe().catch(() => {}).finally(route);
reloadLogs().then(refresh);
</script>
</body>
