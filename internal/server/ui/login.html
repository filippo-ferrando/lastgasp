<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lastgasp login</title>
<style>
:root { --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de; --accent: #c2410c; --bad: #b91c1c; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --text: #e8e8e3; --muted: #9a9a93; --line: #33332f; --accent: #fb923c; --bad: #f87171; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, sans-serif; padding: 16px; }
form { width: min(340px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: grid; gap: 12px; }
h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .02em; }
h1 span { color: var(--accent); }
label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
input, button { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
button { cursor: pointer; background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
button:disabled { opacity: .6; cursor: default; }
#msg { color: var(--bad); min-height: 1.4em; margin: 0; }
</style>
</head>
<body>
<form id="login">
  <h1>last<span>gasp</span></h1>
  <label>User <input id="user" autocomplete="username" required autofocus></label>
  <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
  <button id="go">log in</button>
  <p id="msg" role="alert"></p>
</form>
<script>
const $ = id => document.getElementById(id);
// Only paths on this server, so the login page cannot send the user elsewhere.
const next = (() => {
  const n = new URLSearchParams(location.search).get("next") || "/";
  return n.startsWith("/") && !n.startsWith("//") && !n.startsWith("/\\") ? n : "/";
})();
$("login").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("msg").textContent = "";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: $("user").value, password: $("password").value})});
    if (r.ok) return location.replace(next);
    $("msg").textContent = r.status === 429 ? "Too many failed logins, try again in " + (r.headers.get("Retry-After") || "a few") + " seconds." :
      r.status === 401 ? "Wrong user name or password." : "Login failed: " + (await r.text()).trim();
    $("password").select();
  } catch {
    $("msg").textContent = "The server is not reachable.";
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
